<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><meta name="theme-color" content="#101915"><title>随听 · MusicSquare</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
<header><a class="brand" aria-label="随听首页"><span class="brand-mark" data-icon="music"></span><span>随听<small>MUSIC SQUARE</small></span></a><button class="icon-btn" id="about-button" aria-label="关于随听" data-icon="info"></button></header>
<main id="main">
<section class="page active" id="discover-page">
<form id="search-form" class="searchbox"><span data-icon="search"></span><input id="keyword" maxlength="100" placeholder="搜索单曲、歌手、歌单" enterkeyhint="search" aria-label="搜索内容"><button type="submit" aria-label="开始搜索" data-icon="arrow"></button></form>
<div class="sources"><button class="source selected" data-source="netease"><i class="dot red"></i>网易云</button><button class="source" data-source="qq"><i class="dot green"></i>QQ 音乐</button><button class="source" data-source="kuwo"><i class="dot yellow"></i>酷我</button></div>
<div class="section-head search-results-header"><h2 id="results-heading">搜索结果</h2><label class="search-limit"><select id="search-kind" aria-label="搜索类型"><option value="song">单曲</option><option value="artist">歌手</option><option value="playlist">歌单</option></select><span data-icon="chevron"></span></label></div>
<div id="search-results"></div>
<p id="catalog-source-note" class="catalog-source-note hidden">歌手、歌单搜索当前使用网易云</p><div id="welcome" class="home-recommend"><div class="recommend-tabs"><button id="recommend-playlists" class="selected">推荐歌单</button><button id="recommend-hot">热门歌曲</button><button id="refresh-recommend" aria-label="刷新推荐">刷新</button></div><p class="recommend-caption">网易云精选 · 非个性化推荐</p><div id="recommend-content" aria-live="polite"></div></div>
</section>
<section class="page" id="library-page"><div class="library-actions"><button class="primary" id="import-audio"><span data-icon="plus"></span>本地音乐</button><button class="secondary" id="create-playlist"><span data-icon="folder"></span>新建歌单</button></div><div class="library-tabs"><button class="selected" data-library="favorites">我喜欢</button><button data-library="local">本地音乐</button><button data-library="playlists">歌单</button></div><div id="library-context" class="library-context hidden"><button id="library-back" aria-label="返回全部歌单"><span data-icon="chevron"></span>全部歌单</button><span id="library-context-name"></span></div><div id="library-content" role="region" aria-label="我喜欢的歌曲列表" tabindex="0"></div></section>
<section class="page player-page" id="player-page"><div class="player-heading"><button class="icon-btn" id="collapse-player" aria-label="收起播放页" data-icon="chevron"></button><div><div class="eyebrow">NOW PLAYING</div><span id="playing-source">随听 · 私人音乐空间</span></div><button class="icon-btn" id="add-to-playlist" aria-label="加入歌单" data-icon="plus"></button></div><div id="media-card" class="media-card"><div class="media-flipper"><button id="artwork" class="artwork media-face cover-face" aria-label="翻转封面，查看歌词" aria-expanded="false"><img id="cover" alt="专辑封面" hidden><span id="cover-placeholder"><span class="art-orbit"></span><span data-icon="music"></span><small>GOOD SOUNDS.<br>GOOD COMPANY.</small></span><span class="art-label">MUSIC / FOR YOU</span></button><div id="lyrics-face" class="media-face lyrics-face" aria-hidden="true" inert><div class="lyrics-card-heading"><span>歌词</span><button id="show-cover" class="cover-return" aria-label="返回专辑封面"><span data-icon="disc"></span>返回封面</button></div><p class="lyrics-card-hint">点击一句跳播 · 滑动可浏览</p><div id="lyrics" class="lyrics" role="region" aria-label="可滑动并点击跳播的歌词" tabindex="0"><p class="muted">播放后，有歌词的歌曲会显示在这里。</p></div><span id="lyrics-follow-status" class="lyrics-follow-status">跟随当前播放</span></div></div></div><button id="flip-toggle" class="flip-toggle" aria-label="翻转封面，查看歌词">轻点封面，翻到歌词</button><div class="track-heading"><div><h2 id="track-title">还没有播放音乐</h2><p id="track-artist">挑一首喜欢的，开始吧</p></div><button class="icon-btn favorite" id="favorite-button" aria-label="收藏当前歌曲" data-icon="heart"></button></div><div id="play-error" class="error-panel hidden"></div><div id="preview-notice" class="preview-notice hidden"><strong id="preview-title">当前为试听片段</strong><p id="preview-description"></p><div class="preview-actions"><button id="preview-qq">在 QQ 搜同名歌曲</button><button id="preview-kuwo">在酷我搜同名歌曲</button></div></div><p id="play-status" class="play-status">为这一刻，留一点音乐。</p><div class="progress"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div><div class="player-controls"><button class="icon-btn" id="mode-button" aria-label="播放模式：列表循环" data-icon="repeat"></button><button class="icon-btn skip" id="prev-button" aria-label="上一首" data-icon="prev"></button><button class="main-play" id="play-button" aria-label="播放" data-icon="play"></button><button class="icon-btn skip" id="next-button" aria-label="下一首" data-icon="next"></button><button class="icon-btn" id="queue-button" aria-label="播放队列" data-icon="list"></button></div></section>
</main>
<div id="mini-player" class="mini-player hidden"><button class="mini-info" id="open-player"><div class="mini-art" data-icon="music"></div><div><strong id="mini-title">随听</strong><span id="mini-artist">点击查看播放页</span></div></button><button class="icon-btn" id="mini-play" aria-label="播放或暂停" data-icon="play"></button><button class="icon-btn" id="mini-next" aria-label="下一首" data-icon="next"></button><div class="mini-progress" id="mini-progress"></div></div>
<nav><button class="selected" data-page="discover"><span data-icon="search"></span><span>发现</span></button><button data-page="player"><span data-icon="disc"></span><span>正在播放</span></button><button data-page="library"><span data-icon="folder"></span><span>我的音乐</span></button></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-shade"></div><div class="sheet"><div class="sheet-handle"></div><div class="section-head"><h2 id="modal-title"></h2><button class="icon-btn" id="close-modal" aria-label="关闭" data-icon="close"></button></div><div id="modal-body"></div></div></div>
<script src="lyrics-controller.js"></script><script src="app.js"></script><script src="discover.js"></script></body></html>
